name: CI

on:
  push:
  pull_request:

jobs:
  portable-checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Geometry tests
        shell: pwsh
        run: dotnet run --project .\tests\EarthWorks.GeometryTests\EarthWorks.GeometryTests.csproj -c Release
      - name: Localization audit
        shell: pwsh
        run: .\scripts\Audit-Localization.ps1
